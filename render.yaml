databases:
  - name: scm-inventory-db
    plan: free
    databaseName: scm_inventory
    user: scm_inventory

services:
  - type: web
    name: scm-inventory-dashboard
    runtime: node
    plan: free
    # NODE_ENV=production이어도 Tailwind/PostCSS/TypeScript 등 빌드 도구가 필요하다.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scm-inventory-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
